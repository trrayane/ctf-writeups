user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    client_max_body_size 16M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    server_names_hash_bucket_size 128;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/plain
        text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $request_method $loggable {
        default 1;
        OPTIONS 0;
    }

    proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:10m max_size=100m inactive=60m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream library_backend {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name library.local _;

        root /var/www/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        limit_req zone=general burst=100 nodelay;
        limit_conn conn_limit 20;

        location = /favicon.ico {
            alias /app/code/static/img/logo.svg;
            access_log off;
            log_not_found off;
            expires 7d;
        }

        location = /sitemap.xml {
            access_log off;
            return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>';
        }

        # Deployment artefact directory. Browsing the directory itself is
        # forbidden (a directory listing would reveal everything), but the
        # individual files inside have their own location blocks below.
        location = /deploy {
            return 403;
        }
        location = /deploy/ {
            return 403;
        }
        location = /deploy/nginx.conf {
            alias /opt/deploy/nginx.conf;
            default_type text/plain;
            charset utf-8;
            expires 1d;
            access_log off;
        }

        location /static {
            alias /app/code/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /assets/ {
            alias /var/www/html/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location /covers/ {
            alias /var/lib/library/covers/;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location /downloads/ {
            alias /var/lib/library/downloads/;
            internal;
        }

        location /api/search {
            limit_req zone=search burst=20 nodelay;
            proxy_pass http://library_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache app_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_key "$scheme$request_method$host$request_uri";
        }

        location /api/ {
            proxy_pass http://library_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }

        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://library_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /logout {
            proxy_pass http://library_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            access_log off;
            proxy_pass http://library_backend/health;
        }

        location / {
            proxy_pass http://library_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* \.(bak|swp|swo|orig|save|old|tmp|log)$ {
            deny all;
            access_log off;
            return 404;
        }

        location ~* \.(env|ini|conf|cnf|yaml|yml)$ {
            deny all;
            access_log off;
            return 404;
        }
    }
}
