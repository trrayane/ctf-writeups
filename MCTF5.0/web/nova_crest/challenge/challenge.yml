challenge:
  name: "NovaCrest: BioHazard" # Challenge name

  author: "COn4n" # Author of the challenge

  category: web # Category of the challenge, can be one of: web, pwn, crypto, reverse, misc, forensics, osint

  difficulty: hard # Difficulty of the challenge, can be one of: easy, medium, hard, extreme

  description: Biological hazards! We are facing a serious threat. # Description of the challenge

  wave: 3 # Deployment wave number

  flags: # Flags for the challenge
    - { flag: "mctf{qm0nG_m0n60_1$nT_$afE_7oOl_4f+Er_41L}", case_sensitive: true } # Example flag, case_sensitive indicates if the flag is case sensitive

  need_deploy: true # Whether the challenge needs to be deployed or not


# This Part does not concern challenges authors, it is for infrastructure team to deploy the challenge, it can be left empty for challenges that do not need deployment

deploy:
  subdomain: "biohazard" # Subdomain for the challenge, used for deployment
  port: 10070 # Port for the challenge, used for deployment
  dynamic_instances: false # Whether this challenge uses dynamic instances
  tcp: false # Whether the challenge uses TCP or HTTP, true for TCP, false for HTTP
  noSsl: false # Indicates that this challenge must not use SSL

