<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Render Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="app-header">
        <p class="kicker">Markdown Playground</p>
        <h1>Render markdown and review PDFs in one screen</h1>
        <p class="subtitle">
          Write markdown on the left, render with one click, and inspect the result on the right.
        </p>
      </header>

      <section class="workspace-grid">
        <form id="render-form" class="panel editor-panel">
          <div class="panel-head">
            <h2>Source</h2>
            <div class="status-pill" aria-live="polite">
              <span id="status-dot" class="status-dot" data-state="idle"></span>
              <span id="status-text">Idle</span>
            </div>
          </div>

          <label for="markdown-input" class="input-label">Markdown input</label>
          <textarea
            id="markdown-input"
            name="markdown"
            spellcheck="false"
            placeholder="# Hello&#10;Type your markdown here..."
            required
          ></textarea>

          <div class="actions">
            <button id="render-btn" type="submit">Render Markdown</button>
            <button id="sample-btn" class="ghost" type="button">Load markdown sample</button>
            <button id="clear-btn" class="ghost" type="button">Clear</button>
          </div>
          <p class="hint">Shortcut: Ctrl + Enter to render markdown.</p>
        </form>

        <section class="panel preview-panel" aria-live="polite">
          <div class="panel-head">
            <h2>Rendered Output</h2>
            <a id="download-link" class="download-link" href="#" hidden>Download rendered PDF</a>
          </div>

          <p id="preview-placeholder" class="placeholder">
            Your compiled PDF will appear here.
          </p>
          <p id="result-info" class="result-info" hidden></p>
          <iframe id="pdf-frame" title="Compiled PDF Preview" hidden></iframe>
          <p id="error-box" class="error-box" hidden></p>
        </section>
      </section>
    </main>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
