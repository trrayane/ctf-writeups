<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName localhost

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Expose debug param in page source (rabbit hole — does nothing server-side)
        Header always set X-Debug-Mode "disabled"
        Header always set X-Powered-By "BNM/2.4.1"
        Header always unset Server
    </Directory>

    # Block direct access to includes directory
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
